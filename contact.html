<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Adam Barker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Nav ── -->
  <nav>
    <div class="nav-inner">
      <a class="nav-logo" href="index.html">Adam Barker</a>
      <ul class="nav-links">
        <li><a href="https://linkedin.com/in/adam-barker-gis-analyst" target="_blank">LinkedIn</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="img/adam-barker-resume.pdf" target="_blank">Resume</a></li>
      </ul>
    </div>
  </nav>

  <!-- ── Contact ── -->
  <section id="contact" style="padding-top:3.5rem;">
    <p class="section-label">Contact</p>
    <h2 class="section-title">Get in Touch</h2>
    <form class="contact-box" action="https://formsubmit.co/gis@adam-barker.com" method="POST">
      <p>
        I'm currently looking for GIS analyst and spatial developer roles.
        Send me a message and I'll get back to you.
      </p>
      <input type="hidden" name="_subject" value="New message from adam-barker.com" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_template" value="table" />
      <div class="form-row">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
      </div>
      <textarea name="message" placeholder="Message" rows="5" required></textarea>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <p>© 2026 Adam Barker · <a href="index.html">← Back to Home</a></p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
